class Particle{constructor(){this.reset();}reset(){this.x=Math.random()*W;this.y=Math.random()*H;this.vx=(Math.random()-0.5)*0.3;this.vy=(Math.random()-0.5)*0.3;this.r=Math.random()*1.5+0.5;this.alpha=Math.random()*0.5+0.1;this.color=Math.random()>0.5?'0,245,255':'255,0,229';}update(){this.x+=this.vx;this.y+=this.vy;if(this.x<0||this.x>W)this.vx*=-1;if(this.y<0||this.y>H)this.vy*=-1;}draw(){ctx.beginPath();ctx.arc(this.x,this.y,this.r,0,Math.PI*2);ctx.fillStyle=`rgba(${this.color},${this.alpha})`;ctx.fill();}}

// ── Winner section ──
function renderWinner() {
  const final = MATCHES.matches.find(m => m.stage === 'FINAL');
  if (!final) return;
  const score = final.predicted_score || '?-?';
  const s = score.split('-');
  const winner = s.length === 2 ? (parseInt(s[0]) > parseInt(s[1]) ? 'team1' : 'team2') : '';
  const wFlag = winner === 'team1' ? final.team1_flag : final.team2_flag;
  const wName = winner === 'team1' ? final.team1_zh : final.team2_zh;
  document.getElementById('winnerSection').innerHTML =
    `<div class="winner-glow"></div>
     <div class="winner-card">
       <div class="winner-label">🏆 AI PREDICTED CHAMPION</div>
       <div class="winner-flag">${wFlag}</div>
       <div class="winner-name">${wName}</div>
       <div class="winner-score">FINAL ${score} vs ${winner === 'team1' ? final.team2_zh : final.team1_zh}</div>
     </div>`;
}

// ── Group stage grid ──
function renderGroups() {
  const all = MATCHES.matches.filter(m => !m.is_knockout);
  const groups = {};
  const groupFlags = {};
  all.forEach(m => {
    const g = m.group;
    if (!groups[g]) { groups[g] = []; groupFlags[g] = m.team1_flag; }
    groups[g].push(m);
  });

  let html = '';
  Object.keys(groups).sort().forEach(g => {
    html += `<div class="group-card"><div class="group-title">${groupFlags[g]} ${g}</div>`;
    groups[g].forEach(m => {
      const score = m.status === 'final' ? `${m.score1}-${m.score2}` : (m.predicted_score || 'vs');
      const pastCls = m.is_past ? ' past-match' : '';
      const scoreCls = m.is_past ? ' past-score' : '';
      const pastTag = m.is_past ? '<span class="past-label">完</span>' : '';
      const scorer = m.predicted_first_scorer ? `${m.predicted_first_scorer} (${m.predicted_first_scorer_team||m.team1_zh})` : '';
      const dtFull = fmtDate(m.date, m.kickoff_time) + ' HKT';
      html += `<div class="match-row${pastCls}" onclick="showMatch('${m.team1_zh} vs ${m.team2_zh}','${dtFull}','${m.team1_zh}','${m.team2_zh}','${score}','${scorer}')">
        <div class="match-date">${fmtDateShort(m.date)} ${m.kickoff_time||''}</div>
        <div class="team-name">${m.team1_flag} ${m.team1_zh}${pastTag}</div>
        <div class="match-score-box${scoreCls}">${score}</div>
        <div class="team-name right">${m.team2_zh} <span>${m.team2_flag}</span></div>
      </div>`;
    });
    html += '</div>';
  });
  document.getElementById('groupsGrid').innerHTML = html;
}

// ── Knockout bracket ──
function renderBracket() {
  const all = MATCHES.matches.filter(m => m.is_knockout);
  const rounds = [
    { key: 'R32', label: '32強 · R32', cls: 'round-1' },
    { key: 'R16', label: '16強 · R16', cls: 'round-2' },
    { key: 'QF',  label: '8強 · QF',   cls: 'round-3' },
    { key: 'SF',  label: '4強 · SF',   cls: 'round-4' },
    { key: 'FINAL', label: '決賽 · FINAL', cls: 'round-5' }
  ];

  let html = '';
  rounds.forEach(r => {
    const games = all.filter(m => m.stage === r.key);
    html += `<div class="round ${r.cls}"><div class="round-label">${r.label}</div>`;
    games.forEach(m => {
      const score = m.predicted_score || '?-?';
      const s = score.split('-');
      const t1g = s[0] || '?', t2g = s[1] || '?';
      const w = s.length === 2 ? (parseInt(s[0]) > parseInt(s[1]) ? 1 : (parseInt(s[1]) > parseInt(s[0]) ? 2 : 0)) : 0;
      const pastCls = m.is_past ? ' past-match' : '';
      const scorer = m.predicted_first_scorer ? `${m.predicted_first_scorer} (${m.predicted_first_scorer_team||m.team1_zh})` : '';
      const dtFull = fmtDate(m.date, m.kickoff_time) + ' HKT';
      html += `<div class="bracket-match${pastCls}" onclick="showMatch('${m.team1_zh} vs ${m.team2_zh}','${dtFull}','${m.team1_zh}','${m.team2_zh}','${score}','${scorer}')">
        <div class="b-team ${w===1?'winner':'loser'}"><span>${m.team1_flag}</span> ${m.team1_zh} <span class="b-goals">${t1g}</span></div>
        <div class="b-team ${w===2?'winner':'loser'}"><span>${m.team2_flag}</span> ${m.team2_zh} <span class="b-goals">${t2g}</span></div>
      </div>`;
    });
    html += '</div>';
  });
  document.getElementById('bracketGrid').innerHTML = html;
}

// ── Modal ──
function showMatch(title, datetime, team1, team2, score, firstScorer) {
  const modal = document.getElementById('modal');
  document.getElementById('mTitle').textContent = title;
  document.getElementById('mMeta').textContent = datetime + ' | 預測比分: ' + score;
  const parts = firstScorer.split(' (');
  const scorer = parts[0];
  const team = parts[1] ? parts[1].replace(')','') : team1;
  document.getElementById('mScorer').innerHTML = '<div class="first-scorer-icon">⚽</div><div class="first-scorer-info"><div class="label">估計首名入球 FIRST GOAL</div><div class="name">' + scorer + '</div><div class="team">' + team + '</div></div>';
  const l1 = lineups[team1] || ['估計陣容待定'];
  const l2 = lineups[team2] || ['估計陣容待定'];
  document.getElementById('mLineup').innerHTML = '<div class="lineup-col"><h4>' + team1 + '</h4><ul class="lineup-list">' + l1.map(p => '<li>' + p + '</li>').join('') + '</ul></div><div class="lineup-col"><h4>' + team2 + '</h4><ul class="lineup-list">' + l2.map(p => '<li>' + p + '</li>').join('') + '</ul></div>';
  modal.classList.add('active');
}
function closeModal() { document.getElementById('modal').classList.remove('active'); }
document.getElementById('modal').addEventListener('click', function(e) { if (e.target === this) closeModal(); });

// ── Init ──
renderStats();
renderWinner();
renderGroups();
renderBracket();
</script>
</body>
</html>
